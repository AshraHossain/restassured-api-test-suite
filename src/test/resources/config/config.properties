# ─────────────────────────────────────────────────────────────────
#  REST Assured API Suite — Runtime Config
#  Values here are overridden by environment variables in CI:
#    BASE_URL  → set as a GitHub Actions secret / env var
#    API_KEY   → set as a GitHub Actions secret
# ─────────────────────────────────────────────────────────────────

# Public sandbox used when no BASE_URL env var is set
base.url=https://reqres.in/api

# Default timeouts (milliseconds)
connection.timeout=5000
read.timeout=10000

# Extent report output path (relative to project root)
report.path=target/extent-reports/
